<title>Keuken · Woning Geulwijk</title>
<meta name="description" content="De keuken met kookeiland en eettafel onder het zadeldak: twee schuine kanten met een gelakte Driftwood-plank in de nok. Vergelijk het plafond in Driftwood-stuc met akoestisch vilt (Stockholm in Sand, golvende groeven van goot naar nok) op beide kanten of alleen op de oostkant.">

  </div>
